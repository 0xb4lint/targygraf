<!doctype html>
<html lang="hu">
	<head>
		<meta charset="utf-8">
		<meta name="robots" content="noindex">
		<title>targygraf.hu adatátvitel</title>
	</head>
	<body>
		<noscript><a href="https://targygraf.hu/">targygraf.hu</a></noscript>
		<script>
			/*
			 * Served on the legacy {university}.targygraf.hu origins. Hands
			 * over the progress this origin stored under the old subdomain
			 * URLs (see assets/js/migrate.js). Two modes:
			 *
			 * - Framed (Chrome/Firefox): posts the values to the embedding
			 *   targygraf.hu page. The target origin is pinned.
			 * - Top-level with ?return= (WebKit bounce): reads the storage
			 *   first-party, which no browser partitions, and returns to
			 *   https://targygraf.hu{return}#tgm={payload}. The return value
			 *   must be a plain absolute path, so this cannot redirect
			 *   anywhere but targygraf.hu.
			 */
			(function () {
				'use strict';

				function read(key) {
					try {
						return JSON.parse(window.localStorage.getItem(key));
					} catch (error) {
						return null;
					}
				}

				function collect() {
					return {
						coursesFinished: read('coursesFinished'),
						coursesProcessing: read('coursesProcessing'),
						creditsOptional: read('creditsOptional')
					};
				}

				if (window.parent !== window) {
					var framed = collect();
					framed.type = 'targygraf-migrate';
					window.parent.postMessage(framed, 'https://targygraf.hu');
					return;
				}

				var match = /[?&]return=([^&]*)/.exec(window.location.search);
				if (!match) {
					return; // opened directly, nothing to do
				}

				var path = '/';
				try {
					var candidate = decodeURIComponent(match[1]);
					// A single absolute path only: no host, no scheme, no '//'.
					if (/^\/(?!\/)[a-zA-Z0-9\-\/]*$/.test(candidate)) {
						path = candidate;
					}
				} catch (error) {
					// keep '/'
				}

				var payload = '0';
				try {
					var data = collect();
					if (
						data.coursesFinished !== null ||
						data.coursesProcessing !== null ||
						data.creditsOptional !== null
					) {
						payload = encodeURIComponent(JSON.stringify(data));
					}
				} catch (error) {
					// keep '0'
				}

				window.location.replace('https://targygraf.hu' + path + '#tgm=' + payload);
			})();
		</script>
	</body>
</html>
