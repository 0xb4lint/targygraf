name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Runs the JSON validation suite (the contributor PR gate), the data
      # loader/render unit tests, builds the site, and checks the build
      # output, the legacy-JS localStorage behavior and the Worker end-to-end
      # (which bundles the Worker with a real `wrangler deploy --dry-run`).
      - run: npm ci
      - run: npm test
